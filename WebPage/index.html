<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Website</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            font-family: Arial, sans-serif;
        }
        header, footer {
            background: #333;
            color: white;
            text-align: center;
            padding: 1rem;
        }
        nav {
            width: 200px; /* Navbar on the left with fixed width */
            background: #444;
            color: white;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            /* justify-content: center; */
            align-items: flex-start;
            position: absolute; /* Position navbar on the left */
            top: 0;
            left: 0;
            height: 100%;
        }
        nav ul {
            list-style-type: none;
            padding: 10%;
        }
        nav a {
            color: white;
            text-decoration: none;
            padding: 8px 10px 8px 0 ;
            display: block;
            font-size: large;
        }
        h2{
            padding-top: 10px;
            padding-bottom: 20px;
        }
        .container {
            margin-left: 200px; /* Add left margin to content to prevent overlap */
            display: flex;
            flex: 1;
        }
        .content {
            /* flex: 1;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            padding: 1rem;
            gap: 10px; */

            display: flex;
            flex-wrap: wrap;
            align-items: flex-start;
            flex-direction: row;
            max-height: 100vh;
            padding: 10px;
        }
        .content img {
            /* width: 200px;
            height: 150px;
            object-fit: cover; */
            border-radius: 10px; 
            margin: 10px;
            border: 3px solid #000;
            box-shadow: 3px 3px 8px 0px rgba(0,0,0,0.3); 
            max-width: 23vw;
            padding: 5px;
        }
    </style>
</head>
<body>
    <header>
        <h1>My Flexbox Website</h1>
    </header>
    <nav>
        <h2>Navigation</h2>
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>
    <div class="container">
        <section class="content">
            <img src="./assests/pic1.jpg">
            <img src="./assests/pic2.jpg">
            <img src="./assests/pic3.jpg">
            <img src="./assests/pic4.jpg">
            <img src="./assests/pic5.jpg">
            <img src="./assests/pic6.jpg">
        </section>
    </div>
    <footer>
        <p>&copy; 2025 My Website</p>
    </footer>
</body>
</html>
